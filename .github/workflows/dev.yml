name: Development CD (dev)

on:
  push:
    branches:
      - dev
    paths-ignore:
      - 'k8s/**'
      - '**.md'
permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build Image & Update Dev Manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto Tag (Dev)
        id: tag
        if: github.event_name == 'push'
        run: |
          NEW_TAG="dev-${GITHUB_SHA::7}"
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            amromohmmad/a_fit_backend:${{ steps.tag.outputs.tag || 'pr-check' }}
            amromohmmad/a_fit_backend:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update image tag in k8s/a-fit-deployment.yml
        if: github.event_name == 'push'
        run: |
          sed -i "s|image: amromohmmad/a_fit_backend:.*|image: amromohmmad/a_fit_backend:${{ steps.tag.outputs.tag }}|g" k8s/a-fit-deployment.yml
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add k8s/a-fit-deployment.yml
          git diff --staged --quiet || git commit -m "chore(dev): deploy ${{ steps.tag.outputs.tag }} [skip ci]"
          git pull --rebase origin dev
          git push origin dev