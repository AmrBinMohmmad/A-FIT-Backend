# Backend quality gate + delivery.
#
#   push/PR to dev, main ........ quality (EXACTLY the members of `composer check`)
#   push to dev ................. image  amromohmmad/a_fit_backend:dev + :sha-<short>
#   push to main ................ automatic tag (latest MAJOR.MINOR + 1, starting at 0.1),
#                                 image :<tag> + :latest + :sha-<short>, GitHub release
#
# Secrets required on the repository: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (a Docker Hub
# access token). Without them the image job skips. Every delivery job `needs: quality`.
name: backend

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  IMAGE: amromohmmad/a_fit_backend

jobs:
  quality:
    runs-on: ubuntu-latest
    outputs:
      dockerhub: ${{ steps.secrets.outputs.dockerhub }}
    steps:
      - uses: actions/checkout@v4

      # Secrets are not readable in a job-level `if`; surface their presence as an output so
      # the image job skips (instead of failing) until DOCKERHUB_* are configured.
      - id: secrets
        env:
          HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        run: echo "dockerhub=$HAS_DOCKERHUB" >> "$GITHUB_OUTPUT"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl, zip
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Boot from the example environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Formatting (composer lint)
        run: composer lint

      - name: Static analysis (composer analyse)
        run: composer analyse

      - name: Tests incl. architecture gate (composer test)
        run: composer test

  tag:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version, increment minor, and set tag name
        id: version
        run: |
          latest_tag=$(git tag --list '[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          if [ -z "$latest_tag" ]; then
            # No tag found, start at 0.1
            major=0
            minor=1
          else
            # Get the major and minor versions
            IFS='.' read -r major minor <<< "$latest_tag"
            # Increment minor
            minor=$((minor + 1))
          fi
          tag="$major.$minor"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Next tag: $tag"

      - name: Push the tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

  image:
    needs: [quality, tag]
    # dev: tag is skipped; main: tag must have succeeded. Either way the secrets must exist.
    if: >-
      always() && github.event_name == 'push'
      && needs.quality.result == 'success' && needs.quality.outputs.dockerhub == 'true'
      && (needs.tag.result == 'success' || needs.tag.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # dev → :dev · main → :<tag> :latest · always :sha-<short>
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ needs.tag.outputs.tag }},enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=A-FIT API
            org.opencontainers.image.version=${{ needs.tag.outputs.tag }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [tag, image]
    if: >-
      always() && github.ref == 'refs/heads/main' && needs.tag.result == 'success'
      && (needs.image.result == 'success' || needs.image.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.tag.outputs.tag }}
      IMAGE_BUILT: ${{ needs.image.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: GitHub release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$IMAGE_BUILT" = "true" ]; then
            notes="Image: \`${IMAGE}:${TAG}\` (also \`:latest\`)."
          else
            notes="No image was pushed: configure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN."
          fi
          gh release create "$TAG" --title "API $TAG" --generate-notes --notes "$notes"
