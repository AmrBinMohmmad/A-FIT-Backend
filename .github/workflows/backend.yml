# backend quality gate (D10.21) + delivery.
#
#   push/PR to dev, main ........ quality (EXACTLY the members of `composer check`)
#   push to dev ................. image  amromohmmad/a_fit_backend:dev + :sha-<short>
#   push to main ................ image  :latest + :sha-<short>
#   tag vX.Y.Z .................. image  :X.Y.Z + :X.Y + :latest, and a GitHub release
#
# Secrets required on the repository: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (a Docker Hub
# access token with read/write on the amromohmmad namespace). Every build/deploy job
# `needs: quality`; nothing ships from a red gate.
name: backend

on:
  push:
    branches: [main, dev]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, dev]

env:
  IMAGE: amromohmmad/a_fit_backend

jobs:
  quality:
    runs-on: ubuntu-latest
    outputs:
      dockerhub: ${{ steps.secrets.outputs.dockerhub }}
    steps:
      - uses: actions/checkout@v4

      # Secrets are not readable in a job-level `if`; surface their presence as an output so
      # the image job skips (instead of failing) until DOCKERHUB_* are configured.
      - id: secrets
        env:
          HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        run: echo "dockerhub=$HAS_DOCKERHUB" >> "$GITHUB_OUTPUT"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl, zip
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Boot from the example environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Formatting (composer lint)
        run: composer lint

      - name: Static analysis (composer analyse)
        run: composer analyse

      - name: Tests incl. architecture gate (composer test)
        run: composer test

  image:
    needs: quality
    if: github.event_name == 'push' && needs.quality.outputs.dockerhub == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # dev → :dev · main → :latest · v1.2.3 → :1.2.3 :1.2 :latest · always :sha-<short>
          tags: |
            type=ref,event=branch,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=A-FIT API
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: GitHub release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "API ${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes "Image: \`${IMAGE}:${GITHUB_REF_NAME#v}\` (also \`:latest\`)."
