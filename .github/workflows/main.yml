name: Backend CI/CD - Main Release

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, mysql, gd, pdo_sqlite, sqlite3, bcmath, intl, zip
          coverage: none

      - name: Install Dependencies
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Pest/PHPUnit Tests
        run: php artisan test

  tag:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.tag.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto Tag (Production)
        id: tag
        run: |
          LATEST=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || echo "v0.0.0")
          MAJOR=$(echo $LATEST | cut -d. -f1 | tr -d v)
          MINOR=$(echo $LATEST | cut -d. -f2)
          PATCH=$(echo $LATEST | cut -d. -f3)
          NEW_TAG="v$MAJOR.$MINOR.$((PATCH + 1))"
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git tag $NEW_TAG
          git push origin $NEW_TAG
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "version=${NEW_TAG#v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST_PROD || secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER_PROD || secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd /var/www/sanad-backend || cd /var/www/sanad-backend-prod || { echo "Couldn't find project directory"; exit 1; }

            PREVIOUS_COMMIT=$(git rev-parse HEAD)
            git pull origin main || { echo "git pull failed"; exit 1; }

            composer install --no-dev --optimize-autoloader || {
              echo "composer install failed. Rolling back..."
              git reset --hard $PREVIOUS_COMMIT
              exit 1
            }

            php artisan migrate --force || {
              echo "Migration failed. Rolling back..."
              php artisan migrate:rollback
              exit 1
            }

            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            sudo systemctl restart php8.4-fpm
            echo "Deployment successful"

