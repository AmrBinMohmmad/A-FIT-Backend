name: Production CD (main)

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'k8s/**'
      - '**.md'

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build Image & Update Prod Manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto Tag (Major)
        id: tag
        if: github.event_name == 'push'
        run: |
          git fetch --tags
          LATEST=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
          LATEST=${LATEST:-v0.0.0}
          MAJOR=$(echo $LATEST | cut -d. -f1 | tr -d v)
          NEW_TAG="v$((MAJOR + 1)).0.0"
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git tag $NEW_TAG
          git push origin $NEW_TAG
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "version=${NEW_TAG#v}" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            amromohmmad/a_fit_backend:${{ steps.tag.outputs.tag || 'pr-check' }}
            amromohmmad/a_fit_backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update image tag in k8s/a-fit-deployment.yml
        if: github.event_name == 'push'
        run: |
          sed -i "s|image: amromohmmad/a_fit_backend:.*|image: amromohmmad/a_fit_backend:${{ steps.tag.outputs.tag }}|g" k8s/a-fit-deployment.yml
          git add k8s/a-fit-deployment.yml
          git diff --staged --quiet || git commit -m "chore(release): deploy ${{ steps.tag.outputs.tag }} [skip ci]"
          git pull --rebase origin main
          git push origin main