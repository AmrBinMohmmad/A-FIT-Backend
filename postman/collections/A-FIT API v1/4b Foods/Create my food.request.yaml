$kind: http-request
description: "A private food from a package label. per = serving | 100g; numbers are stored per 100 g. generic_id (optional) files it under a generic item."
url: '{{base_url}}/foods'
method: POST
order: 4000
headers:
  - key: Accept
    value: application/json
  - key: Accept-Language
    value: ar
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Toast, brand X",
      "brand": "Brand X",
      "category": "bread",
      "generic_id": 10,
      "serving_grams": 30,
      "serving_label": "1 slice",
      "per": "serving",
      "calories": 80,
      "protein": 2.5,
      "carbs": 15,
      "fat": 1
    }
