$kind: http-request
description: "Multipart `photo` (jpeg/png/webp, ≤ 2 MB, 64–4096 px). Replaces the previous avatar; 10 uploads/min."
url: '{{base_url}}/me/avatar'
method: POST
order: 2500
headers:
  - key: Accept
    value: application/json
  - key: Accept-Language
    value: ar
body:
  type: formdata
  formdata:
    - key: photo
      type: file
      src: ''
