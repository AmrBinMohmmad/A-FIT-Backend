apiVersion: apps/v1
kind: Deployment
metadata:
  name: a-fit-dep
  namespace: a-fit
  labels:
    app: a-fit-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: a-fit-dep
  template:
    metadata:
      labels:
        app: a-fit-dep
    spec:
      imagePullSecrets:
        - name: regcred
      initContainers:
        - name: a-fit-migration
          image: amromohmmad/a_fit_backend:latest
          command: ["php", "artisan", "migrate", "--force"]
          envFrom:
            - configMapRef:
                name: a-fit-config
            - secretRef:
                name: a-fit-secret
      containers:
        - name: app
          image: amromohmmad/a_fit_backend:latest
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: a-fit-config
            - secretRef:
                name: a-fit-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "640Mi"
              cpu: "500m"
