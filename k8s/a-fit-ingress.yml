apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: a-fit-ingress
  namespace: a-fit
  annotations:
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - a-fitness.duckdns.org
  rules:
    - host: a-fitness.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: a-fit-service
                port:
                  number: 80
