# The API pod: php-fpm (the image) + an nginx sidecar, exactly the compose shape in one pod.
# Init containers copy public/ out of the image for nginx and run the migrations.
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      # nginx/default.conf says `fastcgi_pass app:9000`; php-fpm is in the same pod.
      hostAliases:
        - ip: "127.0.0.1"
          hostnames: ["app"]
      initContainers:
        - name: public
          image: amromohmmad/a_fit_backend
          command: ["sh", "-c", "cp -r /var/www/public/. /public/"]
          volumeMounts:
            - name: public
              mountPath: /public
        - name: migrate
          image: amromohmmad/a_fit_backend
          command: ["php", "artisan", "migrate", "--force"]
          envFrom:
            - secretRef: { name: a-fit-env }
      containers:
        - name: app
          image: amromohmmad/a_fit_backend
          envFrom:
            - secretRef: { name: a-fit-env }
          ports:
            - containerPort: 9000
          readinessProbe:
            tcpSocket: { port: 9000 }
            periodSeconds: 10
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { memory: 512Mi }
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: public
              mountPath: /var/www/public
              readOnly: true
          readinessProbe:
            httpGet: { path: /up, port: 80 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /up, port: 80 }
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
      volumes:
        - name: nginx-conf
          configMap: { name: nginx-conf }
        - name: public
          emptyDir: {}
