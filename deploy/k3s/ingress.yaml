# k3s ships Traefik; TLS comes from cert-manager through the ClusterIssuer. Replace the host.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts: [a-fitness.duckdns.org]
      secretName: api-tls
  rules:
    - host: a-fitness.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
