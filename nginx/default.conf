# A-FIT API edge. TLS terminates at the load balancer / reverse proxy in front of this
# container; this server only speaks to php-fpm and hides every version banner.
server_tokens off;

# Request-level throttle as a cheap first filter in front of Laravel's limiters:
# 30 req/s per IP with a burst of 60 covers a busy phone and stops a flood early.
limit_req_zone $binary_remote_addr zone=api_ip:10m rate=30r/s;

server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;
    charset utf-8;

    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Cache-Control "no-store" always;

    location / {
        limit_req zone=api_ip burst=60 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Uploaded photos (App\Services\Photos, public disk) — immutable random names, long cache.
    location /storage/ {
        alias /var/www/storage/app/public/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location = /up {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 30s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
